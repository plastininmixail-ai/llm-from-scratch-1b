name: Train LLM

on:
  workflow_dispatch:  # запуск вручную
  schedule:
    - cron: '0 0 * * 0'  # раз в неделю

jobs:
  train-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 1440  # 24 часа

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pyyaml requests python-dotenv

      - name: Create directories
        run: |
          mkdir -p checkpoints logs data/binary

      - name: Tokenize data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m framework.data.tokenize \
            --input-dir data/raw \
            --output-dir data/binary/v0 \
            --tokenizer tokenizer/vocab_3k.json \
            --max-bytes 5000000000

      - name: Train v1
        run: |
          TORCH_NUM_THREADS=4 python -m scripts.train_v1 \
            --config configs/v1_fineweb.yaml \
            --warm-start checkpoints/v0_1b_1000/best.pt \
            --max-steps 1000

      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: model-checkpoint
          path: checkpoints/v1_fineweb/best.pt
          retention-days: 30
