# v101 — vocab 3000, seq_len 512

model:
  d_model: 768
  n_heads: 12
  n_layers: 16
  max_seq_len: 512      # увеличено с 256
  dropout: 0.0
  bias: false
  tie_weights: true

training:
  batch_size: 1
  seq_len: 512
  lr: 2e-4
  warmup: 500
  weight_decay: 0.1
  grad_clip: 1.0

tokenizer:
  vocab_size: 3000      # увеличено с 1500
