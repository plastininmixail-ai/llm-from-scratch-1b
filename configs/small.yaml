# Маленькая модель для обучения на CPU (~25M параметров)
# vocab_size будет подставлен из BPE автоматически

model:
  d_model: 384        # размерность embeddings (256/384/512)
  n_heads: 6          # число голов внимания (должно делить d_model)
  n_layers: 6         # число блоков трансформера
  max_seq_len: 512    # контекстное окно (для токенов)
  dropout: 0.1        # регуляризация

mlp:
  hidden_dim_mult: 4  # FFN hidden = d_model * 4

rope:
  enabled: false      # RoPE для современности (Llama-style) — пока выключено
  base: 10000

# Подсчёт параметров (vocab_size=8000):
# embeddings: 8000 * 384 = 3.07M
# position:    512 * 384 = 0.20M
# per block: 4*d_model² + 2*d_model*hidden
#            = 4*147456 + 2*384*1536 = 0.590M + 1.180M = 1.770M
# 6 blocks:                     10.62M
# final LN:                          ~1K
# output head:  8000 * 384 =    3.07M (shared with input embeddings)
# ----
# Total: ~17M (без shared head: ~20M)
#
# Если выставить d_model=512, n_layers=8: ~50M параметров
# Если d_model=256, n_layers=4:                 ~7M