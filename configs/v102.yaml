# v102 — vocab 3000 + seq 512 + RoPE + RMSNorm
# (используем существующий BPE 3K)

model:
  d_model: 768
  n_heads: 12
  n_layers: 16
  max_seq_len: 512
  dropout: 0.0
  bias: false
  rope_enabled: true
  rope_base: 10000.0
  tie_weights: true

training:
  batch_size: 1
  seq_len: 512
  lr: 3e-4
  warmup: 500
  weight_decay: 0.1
  grad_clip: 1.0

tokenizer:
  vocab_size: 3000
