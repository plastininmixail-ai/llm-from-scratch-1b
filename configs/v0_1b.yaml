data:
  binary_format: uint16
  shuffle_seed: 42
model:
  bias: false
  d_model: 2048
  dropout: 0.0
  max_seq_len: 1024
  n_heads: 32
  n_layers: 20
  rope_base: 10000.0
  rope_enabled: true
  tie_weights: true
  vocab_size: 32000
tokenizer:
  bpe_merges: 31744
  vocab_size: 32000
training:
  batch_size: 1
  beta1: 0.9
  beta2: 0.95
  grad_accum: 16
  grad_clip: 1.0
  lr: 0.0003
  min_lr_ratio: 0.1
  seq_len: 1024
  warmup: 500
  weight_decay: 0.1
